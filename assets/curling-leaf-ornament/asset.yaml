# descriptive: find it and understand it
id: curling-leaf-ornament
title: Curling leaf ornament on a long stem
description: A tall foliate ornament of broad lobed leaves that curl into two spirals, one at the top left and one at the top right, with smaller curled leaves sprouting between them; a long thin stem sweeps down from the foliage to the lower right and a short forked twig branches off it toward the lower left. Engraved in dark brown-black line with hatched shading, the leaf and stem interiors filled with the cream paper tone, on a transparent background.
