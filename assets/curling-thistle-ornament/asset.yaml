# descriptive: find it and understand it
id: curling-thistle-ornament
title: Curling thistle ornament
description: A tall thistle ornament in which a thick stem rises from a short rooted base at the bottom right, curves up and to the left, and breaks into spiky, deeply cut thistle leaves that spread in a loose crown across the top; smaller spiky leaf sprays grow from the stem at the right and at the lower left. Engraved in dark brown-black line with hatched shading, the leaf and stem interiors filled with the cream paper tone, on a transparent background.
