# descriptive: find it and understand it
id: hop-vine-scroll
title: Hop vine and leaf scroll panel
description: A wide rectangular panel filled edge to edge with foliage, broad curling lobed leaves on thick stems interwoven with a thinner hop vine that carries serrated leaves and hanging hop cones, the thick stems looping into a large ring at the centre; a thin engraved plate rule runs along all four sides. Engraved in dark brown line only, with the ground showing through between the hatch lines, on a transparent background.
type: ornament
categories:
