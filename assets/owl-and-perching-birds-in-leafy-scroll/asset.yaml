# descriptive: find it and understand it
id: owl-and-perching-birds-in-leafy-scroll
title: Owl mocked by day birds in a leafy scroll
description: A tall panel of broad curling lobed leaves on thick thorny stems, with a shaggy lettuce-like leaf cluster in the middle. At the bottom centre an owl with spread wings perches on a stem and looks straight at the viewer, a crested bird sits below it at the left, a small bird flies left at the top centre, a crested bird flies right at the left middle, a long-necked bird pecks down a stem in the upper centre, and two more birds are cut off by the right edge. Engraved in dark brown line only, with the ground showing through between the hatch lines, on a transparent background.
type: ornament
categories:
